[tool.poetry]
name = "modrinth-downloader"
version = "0.2.0"
description = ""
authors = ["Tomasz Kordiak <dotomika@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"

beautifulsoup4 = "^4.13.4"
httpx = "0.28.1"
rich = "14.1.0"
rich-argparse = "1.7.1"
questionary = "2.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "0.12.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "S", "F", "RUF"]
ignore = ["S301"]
